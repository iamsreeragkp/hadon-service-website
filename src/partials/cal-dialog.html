<dialog class="contact-dialog" id="contact-dialog" aria-labelledby="contact-dialog-title">
  <button class="cal-close" type="button" aria-label="Close" data-contact-close>
    <svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M1 1l10 10M11 1 1 11"/></svg>
  </button>
  <form class="contact-modal-form" id="contact-modal-form" novalidate>
    <h2 id="contact-dialog-title">Contact us</h2>
    <p>Send us a note. We reply within two hours during business hours.</p>
    <label class="sr-only" for="contact-email">Your email</label>
    <input class="input" id="contact-email" name="email" type="email" placeholder="Your email" autocomplete="email" required>
    <label class="sr-only" for="contact-message">Message</label>
    <textarea class="textarea" id="contact-message" name="message" rows="5" placeholder="Write your message" required></textarea>
    <input type="text" name="_honey" class="sr-only" tabindex="-1" autocomplete="off">
    <p class="form-note" data-contact-error hidden>Please add your email and a message.</p>
    <button class="btn btn-primary btn-block" type="submit">Send message <span class="arr">&rarr;</span></button>
  </form>
  <div class="contact-modal-success" role="status" hidden>
    <h2 tabindex="-1">Message sent.</h2>
    <p>We&rsquo;ll write back shortly. You can close this window.</p>
    <button class="btn btn-primary" type="button" data-contact-close>Done</button>
  </div>
</dialog>
